<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>学汉语</title>
  
  <!-- iPhone & Mobile Viewport Configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="学汉语">
  <meta name="theme-color" content="#FBDF98">
  
  <!-- Icons & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  
  <!-- Google Fonts: Chiron GoRound TC & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].update();
        }
      });
    }
  </script>

  <!-- Critical Inline Splash Styles to guarantee zero flash of white on cold launch -->
  <style>
    html, body {
      background-color: #FBDF98 !important;
    }
    .ios-notch-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100vw;
      height: max(env(safe-area-inset-top, 0px), 24px);
      background-color: #FBDF98;
      z-index: 1000000;
      pointer-events: none;
    }
    .app-splash {
      position: fixed;
      top: max(env(safe-area-inset-top, 0px), 0px);
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: calc(100vh - max(env(safe-area-inset-top, 0px), 0px));
      height: calc(100dvh - max(env(safe-area-inset-top, 0px), 0px));
      background-color: #B5DDDC;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      opacity: 1;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .app-splash.splash-fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/style.css?v=56">
</head>
<body>

  <!-- Notch Bar to lock iOS status bar permanently in yellow -->
  <div class="ios-notch-bar" aria-hidden="true"></div>

  <!-- App Intro / Loading Splash Screen (Shows for 3s on open/refresh) -->
  <div id="app-splash" class="app-splash" aria-hidden="true">
    <div class="splash-sun">
      <svg width="100%" height="100%" viewBox="0 0 347 340" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M173.5 2C268.255 2 345 77.2544 345 170C345 262.746 268.255 338 173.5 338C78.7445 338 2 262.746 2 170C2 77.2544 78.7445 2 173.5 2Z" fill="#FFB800" stroke="#FFC701" stroke-width="4"/>
      </svg>
    </div>

    <div class="splash-center">
      <h1 class="splash-title-zh">学汉语</h1>
      <span class="splash-title-en">Learn Chinese</span>
    </div>

    <div class="splash-cloud">
      <svg width="100%" height="100%" viewBox="0 0 477 273" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M171.161 0C215.623 6.23683e-05 252.371 32.0702 258.229 73.6943C270.988 66.6845 285.73 62.6827 301.435 62.6826C333.013 62.6826 360.701 78.8607 376.194 103.148C380.322 102.571 384.542 102.271 388.834 102.271C437.371 102.272 476.719 140.491 476.719 187.636C476.719 231.419 442.783 267.503 399.066 272.427V273H91.5215V272.927C90.3153 272.974 89.103 273 87.8848 273C39.3472 273 0 234.781 0 187.636C9.56953e-05 141.425 37.803 103.792 85.0098 102.318C83.873 96.8388 83.2764 91.1692 83.2764 85.3643C83.2764 38.219 122.624 0 171.161 0Z" fill="white"/>
      </svg>
    </div>
  </div>

  <div id="app-container">

    <!-- Tab 1: List View -->
    <main class="tab-view active" id="view-list">
      <!-- Top Header (Present in Words List View) -->
      <header class="app-header" id="app-header">
        <!-- Row 1: Search Bar & Cloud Sync -->
        <div class="header-search-row">
          <div class="search-bar-wrap">
            <div class="search-icon-svg">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <input type="text" id="search-input" class="search-input" placeholder="Search..." autocomplete="off" autocapitalize="off" spellcheck="false">
            <button class="search-clear-btn" id="btn-search-clear" aria-label="Clear search" style="display: none;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <button class="btn-header-sync" id="btn-cloud-sync" title="Cloud Sync" aria-label="Cloud Sync">
            <svg width="21" height="15" viewBox="0 0 27 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7.03019 16.9372C3.97594 16.9372 1.5 14.5539 1.5 11.6136C1.5 8.67459 3.97594 6.29127 7.03019 6.29127C7.49688 4.1989 9.16056 2.49127 11.3942 1.81084C13.6267 1.13159 16.092 1.58165 17.859 2.99834C19.626 4.41146 20.4264 6.56915 19.9609 8.66152H21.1365C23.4082 8.66152 25.25 10.514 25.25 12.8011C25.25 15.0895 23.4082 16.942 21.1353 16.942H7.03019"></path>
            </svg>
            <span class="sync-status-dot dot-unlinked" id="cloud-sync-dot"></span>
          </button>
        </div>

        <!-- Row 2: Deck Selector & Word Count Badge -->
        <div class="header-deck-row">
          <div class="deck-select-wrap">
            <select id="deck-select" class="deck-select" aria-label="Select Deck"></select>
            <div class="select-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
          <span class="deck-count-text" id="deck-count-badge">0 words</span>
        </div>

        <!-- Row 3: Include Words from Previous Levels Toggle -->
        <div class="cumulative-toggle-row" id="list-cumulative-toggle-wrap" style="display: none;">
          <label class="toggle-container" for="list-cumulative-toggle">
            <span class="toggle-label">include words from previous levels</span>
            <span class="toggle-switch">
              <input type="checkbox" id="list-cumulative-toggle">
              <span class="toggle-slider"></span>
            </span>
          </label>
        </div>
      </header>

      <div class="list-scroll-area" id="list-container">
        <div class="word-list" id="word-list"></div>
      </div>

      <!-- Alphabet Index Scrubber Rail -->
      <nav class="alphabet-scrubber" id="alphabet-scrubber" aria-label="Alphabet Index"></nav>
      <!-- Floating Active Letter Callout Bubble -->
      <div class="alphabet-bubble" id="alphabet-bubble">A</div>
    </main>

    <!-- Tab 2: Flashcard Study View -->
    <section class="tab-view" id="view-flashcard">
      <div class="study-arena" id="flashcard-arena">
        <!-- Rendered dynamically by FlashcardEngine / App -->
      </div>
    </section>

    <!-- Tab 3: Custom Decks & Remember View -->
    <section class="tab-view" id="view-custom">
      <header class="custom-header">
        <h2 class="view-title">Saved & Custom Decks</h2>
      </header>
      <div class="custom-decks-scroll-area" id="custom-decks-list">
        <!-- Rendered dynamically by App -->
      </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="tab-btn active" data-tab="list" aria-label="Words"></button>
      <button class="tab-btn" data-tab="study" aria-label="Study"></button>
      <button class="tab-btn" data-tab="custom" aria-label="Decks"></button>
    </nav>

    <!-- Modal 1: Word Detail Card Modal (Floating Proper Card Deck) -->
    <div class="modal-overlay" id="word-detail-modal" role="dialog" aria-modal="true">
      <div class="modal-deck-container">
        <button class="modal-nav-chevron nav-chevron-prev" id="btn-modal-prev" aria-label="Previous card" title="Previous card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="modal-card-stage" id="modal-card-stage">
          <!-- Populated dynamically by App.openWordDetailModal -->
        </div>

        <button class="modal-nav-chevron nav-chevron-next" id="btn-modal-next" aria-label="Next card" title="Next card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Modal 2: Flashcard Setup Configuration Page (Full-screen view) -->
    <div class="modal-overlay page-modal" id="study-setup-modal" role="dialog" aria-modal="true">
      <div class="page-sheet">
        <header class="page-modal-header">
          <h3 class="page-modal-title">Study Session Setup</h3>
        </header>

        <div class="page-modal-content">
          <!-- Main Deck to Study -->
          <div class="setup-group">
            <label class="setup-label">Main Deck to Study</label>
            <div class="setup-deck-wrap">
              <select id="setup-deck-select" class="setup-deck-select" style="width: 100%;"></select>
              <div class="select-arrow">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <!-- Include Words from Previous Levels Toggle -->
          <div class="setup-group setup-toggle-group" id="setup-cumulative-toggle-wrap" style="display: none;">
            <label class="toggle-container" for="setup-cumulative-toggle">
              <span class="toggle-label">Include words from previous levels</span>
              <span class="toggle-switch">
                <input type="checkbox" id="setup-cumulative-toggle">
                <span class="toggle-slider"></span>
              </span>
            </label>
          </div>

          <!-- Subdeck Word Count -->
          <div class="setup-group">
            <label class="setup-label">Words Per Subdeck</label>
            <div class="pill-grid">
              <button class="btn-pill-size" data-size="10">10</button>
              <button class="btn-pill-size active" data-size="25">25</button>
              <button class="btn-pill-size" data-size="50">50</button>
              <button class="btn-pill-size" data-size="75">75</button>
              <button class="btn-pill-size" data-size="100">100</button>
              <button class="btn-pill-size" data-size="custom">Custom</button>
            </div>
            <input type="number" id="custom-size-input" class="custom-size-input" placeholder="Enter word count (e.g. 30)" style="display: none;" min="1" max="500">
          </div>

          <!-- Dual Row: Deck Pull Order & Within Subdeck -->
          <div class="setup-row-dual">
            <div class="setup-group flex-1">
              <label class="setup-label">Pull from Deck</label>
              <div class="segmented-control">
                <label class="segment-option">
                  <input type="radio" name="pull-order" value="alphabetical" checked>
                  <span>A-Z</span>
                </label>
                <label class="segment-option">
                  <input type="radio" name="pull-order" value="random">
                  <span>Random</span>
                </label>
              </div>
            </div>

            <div class="setup-group flex-1">
              <label class="setup-label">Within Subdeck</label>
              <div class="segmented-control">
                <label class="segment-option">
                  <input type="radio" name="subdeck-order" value="random" checked>
                  <span>Shuffle</span>
                </label>
                <label class="segment-option">
                  <input type="radio" name="subdeck-order" value="alphabetical">
                  <span>A-Z</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Card Face Display -->
          <div class="setup-group">
            <label class="setup-label">Card Front Shows</label>
            <div class="segmented-control">
              <label class="segment-option">
                <input type="radio" name="card-face" value="chinese" checked>
                <span>Chinese First</span>
              </label>
              <label class="segment-option">
                <input type="radio" name="card-face" value="english">
                <span>English First</span>
              </label>
            </div>
          </div>

          <!-- Advanced Range Filter -->
          <div class="setup-group">
            <label class="setup-label">Card Range (Optional)</label>
            <div class="range-box">
              <div class="range-inputs-row">
                <div class="range-field">
                  <label for="range-start">From #</label>
                  <input type="number" id="range-start" value="1" min="1">
                </div>
                <div class="range-field">
                  <label for="range-end">To #</label>
                  <input type="number" id="range-end" placeholder="End of deck" min="1">
                </div>
              </div>
              <p class="range-hint" id="range-preview-hint">
                Study pool: Card <strong>#1</strong> to <strong>End</strong>.
              </p>
            </div>
          </div>

          <button class="btn-primary" id="btn-launch-study">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Start Flashcards</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal 3: Resume or New Study Session -->
    <div class="modal-overlay" id="study-resume-modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="card-header-bar">
          <div class="card-header-meta">
            <span class="detail-index-pill">Study Session</span>
          </div>
          <button class="btn-icon" id="btn-resume-modal-close" title="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="dialog-body" style="padding-top: 18px;">
          <div class="resume-session-info">
            <p class="resume-deck-name" id="resume-deck-title"></p>
            <p class="resume-deck-meta" id="resume-deck-progress"></p>
          </div>
          <div class="dialog-btn-group">
            <button class="btn-primary" id="btn-resume-session">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Continue from previous session</span>
            </button>
            <button class="btn-secondary" id="btn-start-fresh-session">
              Start New Session
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal 4: Exit Study Session Confirmation -->
    <div class="modal-overlay" id="study-exit-modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="dialog-body">
          <div class="result-icon-wrap review-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D97736" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <h3 class="dialog-title">Leave study session?</h3>
          <p class="dialog-desc">
            Your progress is saved, and you can pick back up right where you left off.
          </p>
          <div class="dialog-btn-group">
            <button class="btn-primary" id="btn-confirm-exit-study" style="background: var(--amber);">
              Save & Leave
            </button>
            <button class="btn-secondary" id="btn-cancel-exit-study">
              Keep Studying
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal 5: Cloud Sync Dialog -->
    <div class="modal-overlay" id="cloud-sync-modal" role="dialog" aria-modal="true">
      <div class="modal-card sync-dialog-card">
        <div class="sync-modal-header">
          <div class="sync-modal-title">
            <svg width="22" height="16" viewBox="0 0 27 19" fill="none" stroke="var(--sage)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7.03019 16.9372C3.97594 16.9372 1.5 14.5539 1.5 11.6136C1.5 8.67459 3.97594 6.29127 7.03019 6.29127C7.49688 4.1989 9.16056 2.49127 11.3942 1.81084C13.6267 1.13159 16.092 1.58165 17.859 2.99834C19.626 4.41146 20.4264 6.56915 19.9609 8.66152H21.1365C23.4082 8.66152 25.25 10.514 25.25 12.8011C25.25 15.0895 23.4082 16.942 21.1353 16.942H7.03019"></path>
            </svg>
            <h3>Cloud Sync</h3>
          </div>
          <button class="btn-icon" id="btn-close-sync-modal" title="Close" aria-label="Close dialog">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="sync-modal-content" id="sync-modal-content">
          <!-- Populated dynamically by App.renderCloudSyncModal() -->
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="./js/icons.js?v=56"></script>
  <script src="./js/speech.js?v=56"></script>
  <script src="./js/sync.js?v=56"></script>
  <script src="./js/deck-manager.js?v=56"></script>
  <script src="./js/flashcard.js?v=56"></script>
  <script src="./js/app.js?v=56"></script>
</body>
</html>
