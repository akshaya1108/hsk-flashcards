<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>学汉语</title>
  
  <!-- iPhone & Mobile Viewport Configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="学汉语">
  <meta name="theme-color" content="#F9F6F0">
  
  <!-- Icons & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/style.css?v=44">
</head>
<body>

  <div id="app-container">

    <!-- Tab 1: List View -->
    <main class="tab-view active" id="view-list">
      <!-- Top Header (Present in Words List View) -->
      <header class="app-header" id="app-header">
        <div class="header-top-row">
          <div class="deck-select-wrap">
            <select id="deck-select" class="deck-select" aria-label="Select Deck"></select>
            <div class="select-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <div class="header-action-group">
            <button class="btn-header-sync" id="btn-cloud-sync" title="Cloud Sync (Supabase)" aria-label="Cloud Sync">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
              </svg>
              <span class="sync-status-dot dot-unlinked" id="cloud-sync-dot"></span>
            </button>

            <button class="btn-study-launch" id="btn-start-study" title="Start Study Session">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Study</span>
            </button>
          </div>
        </div>

        <!-- Search Bar & Count Pill -->
        <div class="header-bottom-row">
          <div class="search-bar-wrap">
            <div class="search-icon-svg">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <input type="text" id="search-input" class="search-input" placeholder="Search Hanzi, pinyin, or English..." autocomplete="off" autocapitalize="off" spellcheck="false">
            <button class="search-clear-btn" id="btn-search-clear" aria-label="Clear search" style="display: none;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <span class="count-pill" id="deck-count-badge">0 words</span>
        </div>

        <!-- Include Words from Previous Levels Toggle -->
        <div class="cumulative-toggle-row" id="list-cumulative-toggle-wrap" style="display: none;">
          <label class="toggle-container" for="list-cumulative-toggle">
            <span class="toggle-label">Include words from previous levels</span>
            <span class="toggle-switch">
              <input type="checkbox" id="list-cumulative-toggle">
              <span class="toggle-slider"></span>
            </span>
          </label>
        </div>
      </header>

      <div class="list-scroll-area" id="list-container">
        <div class="word-list" id="word-list"></div>
      </div>

      <!-- Alphabet Index Scrubber Rail -->
      <nav class="alphabet-scrubber" id="alphabet-scrubber" aria-label="Alphabet Index"></nav>
      <!-- Floating Active Letter Callout Bubble -->
      <div class="alphabet-bubble" id="alphabet-bubble">A</div>
    </main>

    <!-- Tab 2: Flashcard Study View -->
    <section class="tab-view" id="view-flashcard">
      <div class="study-arena" id="flashcard-arena">
        <!-- Rendered dynamically by FlashcardEngine / App -->
      </div>
    </section>

    <!-- Tab 3: Custom Decks & Remember View -->
    <section class="tab-view" id="view-custom">
      <header class="custom-header">
        <h2 class="view-title">Saved & Custom Decks</h2>
      </header>
      <div class="custom-decks-scroll-area" id="custom-decks-list">
        <!-- Rendered dynamically by App -->
      </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="tab-btn active" data-tab="list" aria-label="Vocabulary List"></button>
      <button class="tab-btn" data-tab="custom" aria-label="Custom Decks"></button>
    </nav>

    <!-- Modal 1: Word Detail Card Modal (Floating Proper Card Deck) -->
    <div class="modal-overlay" id="word-detail-modal" role="dialog" aria-modal="true">
      <div class="modal-deck-container">
        <button class="modal-nav-chevron nav-chevron-prev" id="btn-modal-prev" aria-label="Previous card" title="Previous card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="modal-card-stage" id="modal-card-stage">
          <!-- Populated dynamically by App.openWordDetailModal -->
        </div>

        <button class="modal-nav-chevron nav-chevron-next" id="btn-modal-next" aria-label="Next card" title="Next card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Modal 2: Flashcard Setup Configuration Sheet -->
    <div class="modal-overlay" id="study-setup-modal" role="dialog" aria-modal="true">
      <div class="modal-sheet">
        <div class="modal-content">
          <div class="modal-header">
            <h3 style="font-size: 18px; font-weight: 700;">Study Session Setup</h3>
            <button class="btn-icon" id="btn-modal-setup-close" title="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Main Deck to Study -->
          <div class="setup-group">
            <label class="setup-label">Main Deck to Study</label>
            <div class="deck-select-wrap" style="width: 100%;">
              <select id="setup-deck-select" class="deck-select" style="width: 100%;"></select>
              <div class="select-arrow">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <!-- Include Words from Previous Levels Toggle -->
          <div class="setup-group setup-toggle-group" id="setup-cumulative-toggle-wrap" style="display: none;">
            <label class="toggle-container" for="setup-cumulative-toggle">
              <span class="toggle-label">Include words from previous levels</span>
              <span class="toggle-switch">
                <input type="checkbox" id="setup-cumulative-toggle">
                <span class="toggle-slider"></span>
              </span>
            </label>
          </div>

          <!-- Subdeck Word Count -->
          <div class="setup-group">
            <label class="setup-label">Words Per Subdeck</label>
            <div class="pill-grid">
              <button class="btn-pill-size" data-size="10">10</button>
              <button class="btn-pill-size active" data-size="25">25</button>
              <button class="btn-pill-size" data-size="50">50</button>
              <button class="btn-pill-size" data-size="75">75</button>
              <button class="btn-pill-size" data-size="100">100</button>
              <button class="btn-pill-size" data-size="custom">Custom</button>
            </div>
            <input type="number" id="custom-size-input" class="custom-size-input" placeholder="Enter word count (e.g. 30)" style="display: none;" min="1" max="500">
          </div>

          <!-- Deck Pull Order -->
          <div class="setup-group">
            <label class="setup-label">Pull from Main Deck</label>
            <div class="segmented-control">
              <label class="segment-option">
                <input type="radio" name="pull-order" value="alphabetical" checked>
                <span>Alphabetical</span>
              </label>
              <label class="segment-option">
                <input type="radio" name="pull-order" value="random">
                <span>Random</span>
              </label>
            </div>
          </div>

          <!-- Subdeck Presentation Order -->
          <div class="setup-group">
            <label class="setup-label">Within Subdeck</label>
            <div class="segmented-control">
              <label class="segment-option">
                <input type="radio" name="subdeck-order" value="random" checked>
                <span>Randomized</span>
              </label>
              <label class="segment-option">
                <input type="radio" name="subdeck-order" value="alphabetical">
                <span>Alphabetical</span>
              </label>
            </div>
          </div>

          <!-- Card Face Display -->
          <div class="setup-group">
            <label class="setup-label">Card Front Shows</label>
            <div class="segmented-control">
              <label class="segment-option">
                <input type="radio" name="card-face" value="chinese" checked>
                <span>Chinese First</span>
              </label>
              <label class="segment-option">
                <input type="radio" name="card-face" value="english">
                <span>English First</span>
              </label>
            </div>
          </div>

          <!-- Advanced Range Filter -->
          <div class="setup-group">
            <label class="setup-label">Advanced Setting: Range Filter</label>
            <div class="range-box">
              <div class="range-inputs-row">
                <div class="range-field">
                  <label for="range-start">Start Card #</label>
                  <input type="number" id="range-start" value="1" min="1">
                </div>
                <div class="range-field">
                  <label for="range-end">End Card # (optional)</label>
                  <input type="number" id="range-end" placeholder="End of deck" min="1">
                </div>
              </div>
              <p class="range-hint" id="range-preview-hint">
                Study pool: Card <strong>#1</strong> to <strong>End</strong>.
              </p>
            </div>
          </div>

          <button class="btn-primary" id="btn-launch-study" style="margin-top: 10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Start Flashcards</span>
          </button>

        </div>
      </div>
    </div>

    <!-- Modal 3: Resume or New Study Session -->
    <div class="modal-overlay" id="study-resume-modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="card-header-bar">
          <div class="card-header-meta">
            <span class="detail-index-pill">Study Session</span>
          </div>
          <button class="btn-icon" id="btn-resume-modal-close" title="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="dialog-body" style="padding-top: 18px;">
          <div class="resume-session-info">
            <p class="resume-deck-name" id="resume-deck-title"></p>
            <p class="resume-deck-meta" id="resume-deck-progress"></p>
          </div>
          <div class="dialog-btn-group">
            <button class="btn-primary" id="btn-resume-session">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Continue from previous session</span>
            </button>
            <button class="btn-secondary" id="btn-start-fresh-session">
              Start New Session
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal 4: Exit Study Session Confirmation -->
    <div class="modal-overlay" id="study-exit-modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="dialog-body">
          <div class="result-icon-wrap review-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D97736" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <h3 class="dialog-title">Leave study session?</h3>
          <p class="dialog-desc">
            Your progress is saved, and you can pick back up right where you left off.
          </p>
          <div class="dialog-btn-group">
            <button class="btn-primary" id="btn-confirm-exit-study" style="background: var(--amber);">
              Save & Leave
            </button>
            <button class="btn-secondary" id="btn-cancel-exit-study">
              Keep Studying
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal 5: Cloud Sync Dialog -->
    <div class="modal-overlay" id="cloud-sync-modal" role="dialog" aria-modal="true">
      <div class="modal-card sync-dialog-card">
        <div class="sync-modal-header">
          <div class="sync-modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            </svg>
            <h3>Cloud Sync</h3>
          </div>
          <button class="btn-icon" id="btn-close-sync-modal" title="Close" aria-label="Close dialog">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="sync-modal-content" id="sync-modal-content">
          <!-- Populated dynamically by App.renderCloudSyncModal() -->
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="./js/icons.js?v=44"></script>
  <script src="./js/speech.js?v=44"></script>
  <script src="./js/sync.js?v=44"></script>
  <script src="./js/deck-manager.js?v=44"></script>
  <script src="./js/flashcard.js?v=44"></script>
  <script src="./js/app.js?v=44"></script>
</body>
</html>
